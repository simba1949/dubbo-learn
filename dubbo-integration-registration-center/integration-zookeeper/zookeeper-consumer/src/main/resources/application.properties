server.port=8080
spring.application.name=zookeeper-consumer

# 协议，默认 dubbo
# dubbo.protocol.name=dubbo
# dubbo协议缺省端口为 20880，rmi协议缺省端口为 1099，http和hessian协议缺省端口为 80；
# 如果没有配置port，则自动采用默认端口，如果配置为-1，则会分配一个没有被占用的端口。
dubbo.protocol.port=-1

# 注册中心地址，多个以 , 分割
dubbo.registry.address=zookeeper://192.168.0.111:2181
# 注册中心用户名和密码
# dubbo.registry.username=
# dubbo.registry.password=

# 配置中心地址，多个以 , 分割
dubbo.config-center.address=zookeeper://192.168.0.111:2181
# 元数据中心地址，多个以 , 分割
dubbo.metadata-report.address=zookeeper://192.168.0.111:2181