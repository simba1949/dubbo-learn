# 应用名
dubbo.application.name=nacos-provider

# dubbo 官方配置：https://cn.dubbo.apache.org/zh-cn/overview/mannual/java-sdk/reference-manual/config/properties/#protocol
# 协议，默认 dubbo
dubbo.protocol.name=dubbo
# dubbo协议缺省端口为 20880，rmi协议缺省端口为 1099，http和hessian协议缺省端口为 80；
# 如果没有配置port，则自动采用默认端口，如果配置为-1，则会分配一个没有被占用的端口。
dubbo.protocol.port=-1

# dubbo QOS 官方概述：https://cn.dubbo.apache.org/zh-cn/overview/mannual/java-sdk/reference-manual/qos/overview/
# 不启用 qos 运维端口，
dubbo.application.qosEnable=false

# 注册中心地址，多个以 , 分割
# 9848 端口用于客户端gRPC请求服务端端口，用于客户端向服务端发起连接和请求
dubbo.registry.address=nacos://192.168.0.111:8848
# 注册中心用户名和密码
# dubbo.registry.username=
# dubbo.registry.password=